<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font (optional but nice) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- <button class="btn play__music">Play Music</button> -->

    <div class="grand__wrapper">

        <div class="container">
    
            <div class="question__wrapper">
    
                <div class="heading">
                    <h1 class="question">Will you be my valentine?</h1>
                </div>
    
                <div class="button__wrapper">
                    <button id="yesBtn" class="btn yes-btn">YES</button>
                    <button id="noBtn" class="btn no-btn">NO</button>
                </div>
    
            </div>
    
    
            <!-- Hidden success message --> 
            <div id="envelope" class="hidden">
                
                <!-- envelope body(content holder) -->
                <div class="envelope__body">
                     <!-- envelope flap(closing and opening lid) -->
                     <div class="envelope__flap"></div>
                     <div class="letter__sheet"></div>
                 </div>

            </div>
    
        </div>
    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
