<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font (optional but nice) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">   
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="question">
            <h1 class="proposal">Will you be my Valentine💕?</h1>

            <div class="button__container">
                <button id="yesBtn" class="btn yes__btn">Yes</button>
                <button id="noBtn" class="btn no__btn">No</button>
            </div>
        </div>

        <div class="hidden" id="envelope">
            <div class="envelope__container">
                <div class="flap"></div>
                <div class="letter"><img src="assets/paper.png" alt=""></div>
                <div class="pocket"></div>
            </div>
            <div class="open__container">
                <button id="openFlap" class="btn open__envelope">Open</button>
            </div>
        </div>
    </div>
    


    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
